<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gutom Roulette — Recipe Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FBF6EC;
    --charcoal: #2B2620;
    --olive: #4B5320;
    --olive-dark: #38400f;
    --yolk: #E8A93B;
    --sienna: #C1502E;
    --line: #E3D9C6;
    --card: #FFFFFF;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--cream);
    color: var(--charcoal);
    font-family: 'Work Sans', sans-serif;
    line-height: 1.5;
  }

  h1, h2, h3, .display {
    font-family: 'Fraunces', serif;
    margin: 0;
  }

  a { color: inherit; }

  /* ---------- Header / Hero ---------- */

  .topbar {
    padding: 16px 24px;
    border-bottom: 3px solid var(--olive);
  }

  .topbar-inner {
    max-width: 1080px;
    margin: 0 auto;
    display: flex;
    align-items: center;
  }

  .topbar .brand {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.15rem;
    color: var(--olive);
    letter-spacing: -0.01em;
  }

  header {
    padding: 56px 24px 40px;
    max-width: 900px;
    margin: 0 auto;
    text-align: center;
  }

  header .display {
    font-size: clamp(2.2rem, 5vw, 3.4rem);
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--olive-dark);
  }

  header p.tagline {
    margin-top: 12px;
    font-size: 1.05rem;
    color: #5b5546;
    max-width: 480px;
    margin-left: auto;
    margin-right: auto;
  }

  /* ---------- Search ---------- */

  .search-wrap {
    max-width: 640px;
    margin: 32px auto 0;
    padding: 0 24px;
  }

  .search-box {
    display: flex;
    gap: 10px;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 999px;
    padding: 8px 8px 8px 22px;
    align-items: center;
  }

  .search-box input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-family: 'Work Sans', sans-serif;
    font-size: 1rem;
    color: var(--charcoal);
  }

  .search-box button {
    background: var(--olive);
    color: white;
    border: none;
    border-radius: 999px;
    padding: 12px 24px;
    font-family: 'Work Sans', sans-serif;
    font-weight: 500;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .search-box button:hover { background: var(--olive-dark); }

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-top: 18px;
  }

  select, .random-btn {
    font-family: 'Work Sans', sans-serif;
    font-size: 0.9rem;
    padding: 9px 16px;
    border-radius: 999px;
    border: 1.5px solid var(--line);
    background: var(--card);
    color: var(--charcoal);
    cursor: pointer;
  }

  .random-btn {
    background: var(--yolk);
    border-color: var(--yolk);
    color: var(--charcoal);
    font-weight: 500;
  }

  .random-btn:hover { background: #d99a2b; }

  /* ---------- Results ---------- */

  main {
    max-width: 1080px;
    margin: 0 auto;
    padding: 40px 24px 100px;
  }

  .status-line {
    text-align: center;
    color: #837b68;
    margin-bottom: 24px;
    font-size: 0.95rem;
    min-height: 1.2em;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 22px;
  }

  .recipe-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .recipe-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 24px rgba(43, 38, 32, 0.1);
  }

  .recipe-card img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    display: block;
  }

  .recipe-card .info {
    padding: 14px 16px 16px;
  }

  .recipe-card .info .cat {
    font-size: 0.78rem;
    color: var(--sienna);
    font-weight: 600;
  }

  .recipe-card .info h3 {
    font-size: 1.05rem;
    font-weight: 600;
    margin-top: 4px;
    line-height: 1.3;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #837b68;
  }

  .empty-state .display {
    font-size: 1.5rem;
    color: var(--olive-dark);
    margin-bottom: 8px;
  }

  /* ---------- Modal ---------- */

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(43, 38, 32, 0.55);
    z-index: 50;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px;
    overflow-y: auto;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--cream);
    max-width: 720px;
    width: 100%;
    border-radius: 6px;
    overflow: hidden;
    position: relative;
  }

  .modal img {
    width: 100%;
    max-height: 320px;
    object-fit: cover;
    display: block;
  }

  .modal-close {
    position: absolute;
    top: 14px;
    right: 14px;
    background: rgba(255,255,255,0.9);
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 1.1rem;
    cursor: pointer;
  }

  .modal-body {
    padding: 28px 32px 36px;
  }

  .modal-body .cat {
    font-size: 0.82rem;
    color: var(--sienna);
    font-weight: 600;
  }

  .modal-body h2 {
    font-size: 1.7rem;
    margin-top: 6px;
    font-weight: 600;
  }

  .modal-section {
    margin-top: 26px;
  }

  .modal-section h4 {
    font-family: 'Work Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--olive-dark);
    margin-bottom: 10px;
  }

  .ingredient-list {
    list-style: none;
    padding: 0;
    margin: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 8px;
  }

  .ingredient-list li {
    font-size: 0.92rem;
    padding: 8px 10px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 4px;
  }

  .modal-section p {
    font-size: 0.95rem;
    white-space: pre-line;
    color: #3d372c;
  }

  .modal-section a.source-link {
    display: inline-block;
    margin-top: 4px;
    color: var(--olive);
    font-weight: 500;
    font-size: 0.92rem;
  }

  footer {
    text-align: center;
    padding: 30px 20px 50px;
    color: #a39c88;
    font-size: 0.85rem;
  }

  @media (max-width: 480px) {
    .search-box { flex-direction: row; padding-left: 16px; }
    .modal-body { padding: 22px 20px 30px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <span class="brand">Gutom Roulette</span>
  </div>
</div>

<header>
  <h1 class="display">What's cooking today?</h1>
  <p class="tagline">Search thousands of recipes by name, browse by cuisine or category, or let us surprise you with something random.</p>
</header>

<div class="search-wrap">
  <form class="search-box" id="searchForm">
    <input type="text" id="searchInput" placeholder="Try “chicken”, “pasta”, “adobo”…" autocomplete="off" />
    <button type="submit">Search</button>
  </form>
  <div class="filters">
    <select id="categorySelect">
      <option value="">All categories</option>
    </select>
    <select id="areaSelect">
      <option value="">All cuisines</option>
    </select>
    <button type="button" class="random-btn" id="randomBtn">🎲 Surprise me</button>
  </div>
</div>

<main>
  <div class="status-line" id="statusLine"></div>
  <div class="grid" id="grid"></div>
</main>

<footer>No cows, chickens, or GPAs were harmed in the making of this app.</footer>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<script>
  const API_BASE = "https://www.themealdb.com/api/json/v1/1";
  const grid = document.getElementById("grid");
  const statusLine = document.getElementById("statusLine");
  const searchForm = document.getElementById("searchForm");
  const searchInput = document.getElementById("searchInput");
  const categorySelect = document.getElementById("categorySelect");
  const areaSelect = document.getElementById("areaSelect");
  const randomBtn = document.getElementById("randomBtn");
  const modalOverlay = document.getElementById("modalOverlay");
  const modalContent = document.getElementById("modalContent");

  function setStatus(text) { statusLine.textContent = text; }

  function renderEmpty(message) {
    grid.innerHTML = "";
    setStatus("");
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <div class="display">No recipes found</div>
      <p>${message}</p>
    </div>`;
  }

  function renderMeals(meals) {
    grid.innerHTML = "";
    meals.forEach(meal => {
      const card = document.createElement("div");
      card.className = "recipe-card";
      card.innerHTML = `
        <img src="${meal.strMealThumb}" alt="${meal.strMeal}" loading="lazy" />
        <div class="info">
          <div class="cat">${meal.strCategory || meal.strArea || "Recipe"}</div>
          <h3>${meal.strMeal}</h3>
        </div>`;
      card.addEventListener("click", () => openRecipe(meal.idMeal));
      grid.appendChild(card);
    });
  }

  async function fetchJSON(url) {
    const res = await fetch(url);
    return res.json();
  }

  async function loadFilters() {
    const [catData, areaData] = await Promise.all([
      fetchJSON(`${API_BASE}/list.php?c=list`),
      fetchJSON(`${API_BASE}/list.php?a=list`)
    ]);
    (catData.meals || []).forEach(c => {
      const opt = document.createElement("option");
      opt.value = c.strCategory;
      opt.textContent = c.strCategory;
      categorySelect.appendChild(opt);
    });
    (areaData.meals || []).forEach(a => {
      const opt = document.createElement("option");
      opt.value = a.strArea;
      opt.textContent = a.strArea;
      areaSelect.appendChild(opt);
    });
  }

  async function searchByName(name) {
    setStatus("Searching…");
    const data = await fetchJSON(`${API_BASE}/search.php?s=${encodeURIComponent(name)}`);
    if (!data.meals) {
      renderEmpty(`We couldn't find anything for "${name}". Try a different word.`);
      return;
    }
    setStatus(`${data.meals.length} recipe${data.meals.length > 1 ? "s" : ""} found`);
    renderMeals(data.meals);
  }

  async function filterByCategoryOrArea(category, area) {
    setStatus("Loading…");
    let url = "";
    if (category) url = `${API_BASE}/filter.php?c=${encodeURIComponent(category)}`;
    else if (area) url = `${API_BASE}/filter.php?a=${encodeURIComponent(area)}`;
    const data = await fetchJSON(url);
    if (!data.meals) {
      renderEmpty("No recipes matched that filter.");
      return;
    }
    setStatus(`${data.meals.length} recipe${data.meals.length > 1 ? "s" : ""} found`);
    renderMeals(data.meals);
  }

  async function loadRandom() {
    setStatus("Picking something for you…");
    const data = await fetchJSON(`${API_BASE}/random.php`);
    if (data.meals) {
      setStatus("Here's a random pick");
      renderMeals(data.meals);
    }
  }

  async function openRecipe(id) {
    modalContent.innerHTML = `<div style="padding:60px;text-align:center;color:#837b68;">Loading recipe…</div>`;
    modalOverlay.classList.add("open");
    const data = await fetchJSON(`${API_BASE}/lookup.php?i=${id}`);
    const meal = data.meals[0];

    const ingredients = [];
    for (let i = 1; i <= 20; i++) {
      const ing = meal[`strIngredient${i}`];
      const measure = meal[`strMeasure${i}`];
      if (ing && ing.trim()) {
        ingredients.push(`${measure ? measure.trim() : ""} ${ing.trim()}`.trim());
      }
    }

    modalContent.innerHTML = `
      <button class="modal-close" id="closeModal">✕</button>
      <img src="${meal.strMealThumb}" alt="${meal.strMeal}" />
      <div class="modal-body">
        <div class="cat">${meal.strCategory || ""} ${meal.strArea ? "· " + meal.strArea : ""}</div>
        <h2>${meal.strMeal}</h2>

        <div class="modal-section">
          <h4>Ingredients</h4>
          <ul class="ingredient-list">
            ${ingredients.map(i => `<li>${i}</li>`).join("")}
          </ul>
        </div>

        <div class="modal-section">
          <h4>Instructions</h4>
          <p>${meal.strInstructions}</p>
          ${meal.strSource ? `<a class="source-link" href="${meal.strSource}" target="_blank" rel="noopener">Original source ↗</a>` : ""}
        </div>
      </div>
    `;
    document.getElementById("closeModal").addEventListener("click", closeModal);
  }

  function closeModal() {
    modalOverlay.classList.remove("open");
    modalContent.innerHTML = "";
  }

  modalOverlay.addEventListener("click", (e) => {
    if (e.target === modalOverlay) closeModal();
  });

  searchForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const val = searchInput.value.trim();
    if (val) {
      categorySelect.value = "";
      areaSelect.value = "";
      searchByName(val);
    }
  });

  categorySelect.addEventListener("change", () => {
    if (categorySelect.value) {
      areaSelect.value = "";
      searchInput.value = "";
      filterByCategoryOrArea(categorySelect.value, "");
    }
  });

  areaSelect.addEventListener("change", () => {
    if (areaSelect.value) {
      categorySelect.value = "";
      searchInput.value = "";
      filterByCategoryOrArea("", areaSelect.value);
    }
  });

  randomBtn.addEventListener("click", () => {
    searchInput.value = "";
    categorySelect.value = "";
    areaSelect.value = "";
    loadRandom();
  });

  // initial load
  loadFilters();
  searchByName("chicken");
</script>

</body>
</html>
